name: Publish to npm

# Publica o fork no npm (@flaviogarrido/reversa) quando uma tag vX.Y.Z é enviada.
# Antes de publicar, roda os mesmos gates do CI. Autentica por Trusted Publishing
# (OIDC do GitHub Actions, configurado no pacote em npmjs.com com "Allow npm publish";
# exige npm >= 11.5.1). Não há token nem segredo de npm no repositório.
#
#   npm version patch          # sobe a versão e cria a tag
#   git push                   # envia o commit
#   git push origin vX.Y.Z     # envia só a tag e dispara este workflow
#
# Não use --follow-tags: ele leva junto as tags do upstream que faltam no fork, e o GitHub
# não dispara workflows num push com mais de 3 tags. Tag enviada sem execução:
#   gh workflow run publish.yml --repo flaviogarrido/reversa --ref vX.Y.Z

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # Trusted Publishing (OIDC) e proveniência do pacote

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Garantir npm com Trusted Publishing (>= 11.5.1)
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Conferir nome do pacote e tag
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "Pacote: $NAME@$VERSION"
          if [ "$NAME" = "reversa" ]; then
            echo "::error::package.json ainda usa o nome do upstream; o fork publica com escopo."
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$VERSION" ]; then
            echo "::error::A tag ${GITHUB_REF_NAME} não bate com a versão v$VERSION do package.json."
            exit 1
          fi

      - run: npm ci

      - name: Gates do CI
        run: |
          npm run verify
          dotnet test tools/SkillStudio/tests/SkillStudio.Tests

      - name: Conferir conteúdo do pacote
        run: npm pack --dry-run

      - name: Publicar
        run: npm publish --provenance --access public
