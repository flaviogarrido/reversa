name: Publish to npm

# Publica o fork no npm (@flaviogarrido/reversa) quando uma tag vX.Y.Z é enviada.
# Antes de publicar, roda os mesmos gates do CI. Autentica por Trusted Publishing
# (OIDC do GitHub Actions, configurado no pacote em npmjs.com; exige npm >= 11.5.1).
# O segredo NPM_TOKEN é só um fallback temporário: apague-o junto com o token no npm.
#
#   npm version patch        # sobe a versão e cria a tag
#   git push --follow-tags   # dispara este workflow

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # Trusted Publishing (OIDC) e proveniência do pacote

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Garantir npm com Trusted Publishing (>= 11.5.1)
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Conferir nome do pacote e tag
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "Pacote: $NAME@$VERSION"
          if [ "$NAME" = "reversa" ]; then
            echo "::error::package.json ainda usa o nome do upstream; o fork publica com escopo."
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$VERSION" ]; then
            echo "::error::A tag ${GITHUB_REF_NAME} não bate com a versão v$VERSION do package.json."
            exit 1
          fi

      - run: npm ci

      - name: Gates do CI
        run: |
          npm run verify
          dotnet test tools/SkillStudio/tests/SkillStudio.Tests

      - name: Conferir conteúdo do pacote
        run: npm pack --dry-run

      - name: Publicar
        run: npm publish --provenance --access public
        env:
          # Fallback até o token ser apagado; com Trusted Publishing o npm usa OIDC primeiro.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
